<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6E5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head><body>
<title>Mein Schulplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: notebook-style app shell, slim nav rail left (bottom bar on phones), dot-grid paper behind cards */
:root{
  --bg:#EDF0EE; --paper:#FBFCFB; --sunk:#E3E8E5; --line:#CDD6D1; --dot:#C3CCC7;
  --ink:#16201C; --ink2:#4A5752; --muted:#75837D;
  --accent:#0E6E5C; --accent-ink:#FFFFFF; --accent-soft:#D3EBE4;
  --hl:#F4D35E; --hl-soft:#FBF1C4;
  --bad:#C0352B; --bad-soft:#F9DEDA; --warn:#A86A00; --warn-soft:#FBEBC8; --good:#1E7A3C; --good-soft:#D8F0DF;
  --holiday:#E7E0F5; --holiday-ink:#4D3A86;
  --shadow:0 1px 2px rgba(22,32,28,.06),0 6px 18px rgba(22,32,28,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --paper:#1A221E; --sunk:#232D28; --line:#33403A; --dot:#2A3530;
  --ink:#E8EEEA; --ink2:#B4C1BA; --muted:#8A9891;
  --accent:#4CC2A5; --accent-ink:#0B1F19; --accent-soft:#1E3C34;
  --hl:#E8C547; --hl-soft:#3A3418;
  --bad:#FF7A6E; --bad-soft:#3F201D; --warn:#F0B44A; --warn-soft:#3A2D14; --good:#6BD08B; --good-soft:#1C3524;
  --holiday:#2E2745; --holiday-ink:#C9B9F5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --paper:#1A221E; --sunk:#232D28; --line:#33403A; --dot:#2A3530;
  --ink:#E8EEEA; --ink2:#B4C1BA; --muted:#8A9891;
  --accent:#4CC2A5; --accent-ink:#0B1F19; --accent-soft:#1E3C34;
  --hl:#E8C547; --hl-soft:#3A3418;
  --bad:#FF7A6E; --bad-soft:#3F201D; --warn:#F0B44A; --warn-soft:#3A2D14; --good:#6BD08B; --good-soft:#1C3524;
  --holiday:#2E2745; --holiday-ink:#C9B9F5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.5vw,40px);font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;
  border-right:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink2);font-weight:600}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--paper)}
.rail .spacer{flex:1}
.sync{font-size:12px;color:var(--muted);padding:8px 12px;display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
main{padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--ink2);margin:6px 0 0;max-width:65ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dash{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2{grid-template-columns:minmax(0,1fr)}}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-mono);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--ink2);font-weight:600;font-size:13px}
.stat.bad .n{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;line-height:0}
.icon-btn:hover{background:var(--sunk);color:var(--bad)}
.icon-btn svg{width:16px;height:16px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent)}
.check.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-good{background:var(--good-soft);color:var(--good)}
.p-acc{background:var(--accent-soft);color:var(--accent)} .p-hol{background:var(--holiday);color:var(--holiday-ink)} .p-mut{background:var(--sunk);color:var(--ink2)}
.dotc{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.empty{color:var(--muted);padding:14px 2px;font-size:14px}
.banner{background:var(--hl-soft);border:1px dashed var(--warn);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;max-width:70ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grade{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.g-bad{color:var(--bad)} .g-ok{color:var(--ink)} .g-good{color:var(--good)}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:90px;resize:vertical}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.form .full{grid-column:1/-1}
.tabs{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
/* subjects */
.subj{display:flex;flex-direction:column;gap:10px}
.subj .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.subj .avg{font-family:var(--f-mono);font-size:28px;font-weight:700}
.subj.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset,var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 8px;font-size:13px;background:var(--bg)}
.gchip .w{color:var(--muted);font-size:11px}
.gchip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font-size:14px;line-height:1}
.need{background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.need .inl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.need input{width:64px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px}
/* calendar */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.calnav{display:flex;gap:6px;align-items:center}
.calnav b{font-family:var(--f-display);font-size:18px;min-width:12ch}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.week{min-width:860px;display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.wk-h{padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13px;min-height:58px}
.wk-h b{display:block;font-family:var(--f-display);font-size:16px}
.wk-h.today{background:var(--accent-soft)}
.wk-h.hol{background:var(--holiday)}
.wk-all{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:34px}
.ev-chip{font-size:11.5px;border-radius:5px;padding:2px 5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;cursor:default}
.ev-chip.test{background:var(--bad-soft);color:var(--bad)}
.ev-chip.task{background:var(--warn-soft);color:var(--warn)}
.ev-chip.study{background:var(--accent-soft);color:var(--accent)}
.ev-chip.review{background:var(--hl-soft);color:var(--ink)}
.ev-chip.hol{background:var(--holiday);color:var(--holiday-ink)}
.wk-time{position:relative;font-size:11px;color:var(--muted)}
.wk-time span{position:absolute;right:6px;transform:translateY(-50%)}
.wk-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--sunk) 1px,transparent 1px);background-size:100% var(--hour)}
.wk-col.hol{background-color:color-mix(in srgb,var(--holiday) 45%,transparent)}
.blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11.5px;line-height:1.2;overflow:hidden;border-left:3px solid rgba(0,0,0,.25);color:#15201B}
.blk b{display:block;font-size:12px}
.blk.study{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent)}
.blk.rev{background:var(--hl-soft);color:var(--ink);border-left-color:var(--warn)}
.blk.sdone{opacity:.5;text-decoration:line-through}
.blk.hobby{background:repeating-linear-gradient(135deg,var(--hl-soft) 0 6px,color-mix(in srgb,var(--hl) 40%,var(--hl-soft)) 6px 7px);color:var(--ink);border-left-color:var(--hl)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .dn{font-size:12px;color:var(--muted);font-weight:700;padding:2px 6px}
.mday{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mday.out{opacity:.45}
.mday.hol{background:var(--holiday)}
.mday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mday .num{font-weight:700;font-size:13px}
@media (max-width:640px){.mday{min-height:64px}.mday .ev-chip{font-size:10px;padding:1px 3px}}
/* habits */
.hgrid{border-collapse:separate;border-spacing:3px;font-size:12px}
.hgrid th{font-weight:600;color:var(--muted);text-align:center;min-width:22px}
.hgrid th.name{text-align:left;color:var(--ink);font-size:13px;white-space:nowrap;padding-right:8px;position:sticky;left:0;background:var(--paper);z-index:1}
.hgrid td{text-align:center}
.hgrid th.today{color:var(--accent)}
.hb{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;padding:0}
.hb.on{border-color:transparent}
.hb.future{opacity:.35}
.hb.today{border-color:var(--accent)}
.pix{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:330px}
.pix div{aspect-ratio:1;border-radius:5px;background:var(--sunk);font-size:10px;display:grid;place-items:center;color:var(--muted);max-width:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.scale{display:flex;gap:4px}
.scale button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.goalcard{display:flex;flex-direction:column;gap:8px}
.goalcard .k{font-family:var(--f-mono);font-size:22px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.plan{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pday{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.pday .d{font-size:12px;color:var(--muted);font-weight:700;padding-top:3px}
.pday .items{display:flex;flex-direction:column;gap:4px}
.pitem{display:flex;gap:8px;align-items:center;font-size:14px}
.pitem .check{width:18px;height:18px}
.pitem.done span{text-decoration:line-through;color:var(--muted)}
table.tt{width:100%;border-collapse:collapse;font-size:14px}
table.tt th,table.tt td{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
table.tt th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:0}
table.tt input,table.tt select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 6px;width:100%;min-width:70px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,16,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:14px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0;justify-content:space-around;background:var(--paper)}
  .brand,.rail .spacer,.sync{display:none}
  nav.rail{overflow-x:auto;justify-content:flex-start}
  .navbtn{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1 0 58px;align-items:center;text-align:center}
  main{padding-bottom:100px}
}
/* Mein Fortschritt */
:root{--p1:#6D4AFF;--p2:#E8573A;--p3:#14996A;--p4:#E39B0B;--hero-bg:#141A2E;--hero-fg:#F4F6FF;--hero-muted:#AEB6D6;--ring-track:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--p1:#9A85FF;--p2:#FF7F63;--p3:#3CC891;--p4:#F2B53A;--hero-bg:#1C2340;--hero-fg:#F4F6FF;--hero-muted:#AEB6D6;--ring-track:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--p1:#9A85FF;--p2:#FF7F63;--p3:#3CC891;--p4:#F2B53A;--hero-bg:#1C2340;--hero-fg:#F4F6FF;--hero-muted:#AEB6D6;--ring-track:rgba(255,255,255,.12)}
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--hero-bg);color:var(--hero-fg);padding:28px;display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40%;z-index:-1;background:radial-gradient(closest-side at 18% 30%,color-mix(in srgb,var(--p1) 55%,transparent),transparent),radial-gradient(closest-side at 80% 20%,color-mix(in srgb,var(--p2) 40%,transparent),transparent),radial-gradient(closest-side at 70% 85%,color-mix(in srgb,var(--p3) 40%,transparent),transparent),radial-gradient(closest-side at 30% 90%,color-mix(in srgb,var(--p4) 30%,transparent),transparent);filter:blur(30px);opacity:.75}
.hero-txt{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero h1{color:var(--hero-fg)} .hero p{margin:0;color:var(--hero-muted);max-width:52ch}
.hero-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--hero-fg)} .hero-btn:hover{background:rgba(255,255,255,.2)} .hero-btn:disabled{opacity:.35;cursor:default}
.ring-wrap{position:relative;flex:none;max-width:100%}
.ring-wrap .ring{display:block;max-width:100%;height:auto}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c span{font-size:52px;font-weight:700;line-height:1}
.ring-c small{font-size:13px;font-weight:600;margin-top:4px}

<script>
/* ---------- Daten & Hilfen ---------- */
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYS_LONG=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const COLORS=['#9CC9F0','#F5B7A4','#B9E0A5','#F3D27A','#C9B6F2','#8FD8CF','#F2A9C9','#C8CFA0','#A9C1F5','#E8BC8F','#B3D9E8','#D9B3A0'];
// Schulferien Basel-Stadt (Quelle: Erziehungsdepartement BS, via localcities.ch)
const HOLIDAYS=[
  ['Herbstferien','2026-09-26','2026-10-11'],['Winterferien','2026-12-19','2027-01-03'],
  ['Fasnachtsferien','2027-02-06','2027-02-21'],['Frühlingsferien','2027-03-20','2027-04-04'],
  ['Sommerferien','2027-07-03','2027-08-15'],['Herbstferien','2027-10-02','2027-10-17'],
  ['Winterferien','2027-12-18','2028-01-02'],['Fasnachtsferien','2028-02-26','2028-03-12'],
  ['Frühlingsferien','2028-04-08','2028-04-23'],['Sommerferien','2028-07-01','2028-08-13']];
const FEIERTAGE={'2027-05-01':'Tag der Arbeit','2027-05-06':'Auffahrt','2027-05-07':'Auffahrtsbrücke','2027-05-17':'Pfingstmontag',
  '2028-05-01':'Tag der Arbeit','2028-05-25':'Auffahrt','2028-05-26':'Auffahrtsbrücke','2028-06-05':'Pfingstmontag'};

const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const todayS=()=>ds(new Date());
const isoDow=s=>{const g=pd(s).getDay();return g===0?7:g};
const mondayOf=s=>addDays(s,1-isoDow(s));
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmt=s=>{const d=pd(s);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`};
const fmtShort=s=>{const d=pd(s);return `${DAYS[isoDow(s)-1]}, ${d.getDate()}.${d.getMonth()+1}.`};
const tmin=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const holidayOn=s=>{for(const h of HOLIDAYS) if(s>=h[1]&&s<=h[2]) return h[0]; return FEIERTAGE[s]||null};
const schoolFree=s=>!!holidayOn(s);


// Stundenplan (Schuljahr 2026/2027)
const SLOTS=[['08:00','08:45'],['08:55','09:40'],['09:50','10:35'],['10:50','11:35'],['11:45','12:30'],['12:35','13:20'],['13:25','14:10'],['14:20','15:05'],['15:15','16:00'],['16:10','16:55'],['17:00','17:45']];
const ABBR={EN:'Englisch',DE:'Deutsch',FR:'Französisch',MT:'Mathematik',FRW:'Finanz- und Rechnungswesen',WIR:'Wirtschaft und Recht',INF:'Informatik',SPO:'Sport',TU:'TU','.CAE':'CAE (Freifach)','.LAT':'Latein (Freifach)'};
const REAL_TT={
  1:[['EN','321'],['EN','321'],['TU','424'],['TU','424'],null,['SPO','Gh2'],['SPO','Gh2']],
  2:[['EN','322'],['DE','121'],['FRW','105'],['FRW','105'],['MT','105'],null,['WIR','224'],['WIR','224']],
  3:[['MT','118'],['FR','424'],['FR','424'],['WIR','224'],['WIR','224'],['DE','207'],null,null,null,['.CAE','322'],['.CAE','322']],
  4:[['FR','325'],['FR','325'],['DE','119'],['DE','119'],['FRW','105'],['EN','319'],null,null,null,['.LAT',''],['.LAT','']],
  5:[['INF','411'],['INF','411'],['INF','411'],['INF','411'],['INF','411'],null,['INF','412'],['INF','412'],['INF','412'],['INF','412'],['INF','412']]};
function realTimetable(){
  const out=[];
  for(const [day,row] of Object.entries(REAL_TT)) row.forEach((c,i)=>{if(c) out.push({id:uid(),day:+day,start:SLOTS[i][0],end:SLOTS[i][1],subject:ABBR[c[0]]||c[0],room:c[1],real:1})});
  return out;
}
function seedProgress(){
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const T=todayS(), mon0=mondayOf(T), subs=['Mathematik','Französisch','Englisch','Wirtschaft und Recht','Deutsch','Finanz- und Rechnungswesen'];
  const whats={'Mathematik':'Übungsaufgaben','Französisch':'Vocabulaire','Englisch':'Voci Unit 5','Wirtschaft und Recht':'Zusammenfassung OR','Deutsch':'Lektüre gelesen','Finanz- und Rechnungswesen':'Buchungssätze'};
  for(let w=5;w>=0;w--){const f=w===0?.8:.3+(5-w)*.11, mon=addDays(mon0,-7*w);
    for(let i=0;i<7;i++){const d=addDays(mon,i);if(d>=T)break;
      S.habits.forEach(h=>{if(rnd()<f){(S.exHabit[d]=S.exHabit[d]||{})[h.id]=1}});
      if((w===0&&i%2===0)||rnd()<f*.95)S.studyDone[`ex|${d}|${i}`]='ex';
      if(w===0||rnd()<f){const sb=subs[Math.floor(rnd()*subs.length)];S.studyLog.push({id:uid(),date:d,subject:sb,what:whats[sb],min:[20,30,45,60][Math.floor(rnd()*4)],ex:true})}}}
  S.journal.push({id:uid(),date:addDays(T,-1),type:'erkenntnis',subject:'',text:'Wenn ich direkt nach der Schule 30 Minuten lerne, bin ich abends viel entspannter.',ex:true},
    {id:uid(),date:addDays(T,-3),type:'gelernt',subject:'Wirtschaft und Recht',text:'Ein Vertrag braucht übereinstimmende Willenserklärungen, Form ist meistens frei.',ex:true},
    {id:uid(),date:addDays(T,-5),type:'idee',subject:'Französisch',text:'Voci auf Karteikarten schreiben und im Tram durchgehen.',ex:true});
  S.goals.push({id:uid(),text:'Unter der Woche vor 22:30 schlafen',progress:40,ex:true},{id:uid(),text:'Französisch auf eine 4.5 bringen',progress:30,ex:true},{id:uid(),text:'Jeden Sonntag die Woche planen',progress:70,ex:true});
}
function migrate(){
  if(!S.prog){S.studyLog=S.studyLog||[];S.journal=S.journal||[];S.goals=S.goals||[];S.reviews=S.reviews||{};S.exHabit={};
    Object.assign(S.settings,{sessionGoal:6,minuteGoal:300},{...S.settings});if(S.hasExamples)seedProgress();S.prog=1}
  if(!S.w01){S.grades.concat(S.tests).forEach(x=>{if(x.ex&&x.weight>1)x.weight=1});S.w01=1}
  if(!S.ttReal){S.timetable=S.timetable.filter(l=>!l.ex).concat(realTimetable());S.ttReal=1;
    S.grades.forEach(g=>{if(g.ex&&g.subject==='Biologie')g.subject='Wirtschaft und Recht'})}
  migrate2();migrate3();
}

function seed(){

function subjects(){
  const set=new Set();
  S.timetable.forEach(l=>l.subject&&set.add(l.subject.trim()));
  S.extraSubjects.forEach(s=>set.add(s));
  S.grades.forEach(g=>set.add(g.subject));

  return [...set].filter(Boolean).sort((a,b)=>a.localeCompare(b,'de'));
}
function colorOf(sub){
  if(!sub) return 'var(--sunk)';
  if(S.subjectColors[sub]) return S.subjectColors[sub];
  const i=subjects().indexOf(sub);
  if(i>=0) return COLORS[i%COLORS.length];
  let h=0;for(const c of sub)h=(h*31+c.charCodeAt(0))>>>0;
  return COLORS[h%COLORS.length];
}
function subjAvg(sub){
  const gs=S.grades.filter(g=>g.subject===sub);
  const W=gs.reduce((a,g)=>a+ +g.weight,0); if(!W) return null;
  return {avg:gs.reduce((a,g)=>a+g.value*g.weight,0)/W,W,sum:gs.reduce((a,g)=>a+g.value*g.weight,0),n:gs.length};
}
function overallAvg(){
  const a=subjects().map(subjAvg).filter(Boolean);
  return a.length?a.reduce((x,y)=>x+y.avg,0)/a.length:null;
}
const gradeClass=v=>v==null?'':v<S.settings.redBelow?'g-bad':v>=5?'g-good':'g-ok';
const zeugnis=v=>Math.round(v*2)/2;
function neededGrade(sub,target,w){
  const a=subjAvg(sub); if(!a) return target;
  return (target*(a.W+w)-a.sum)/w;
}

/* Lernplan: aktiv lernen bis 2 Tage vor dem Test, am Tag davor nur wiederholen */
function studyPlan(test){
  const T=todayS(); const out=[];
  const review=addDays(test.date,-1);
  let start=addDays(test.date,-7); if(start<T) start=T;
  const last=addDays(test.date,-2);
  const learnDays=[]; for(let d=start; d<=last; d=addDays(d,1)) learnDays.push(d);
  const goals=test.goals.length?test.goals:[{id:'all',text:'Stoff durcharbeiten'}];
  if(learnDays.length){
    const per=learnDays.map(()=>[]);
    goals.forEach((g,i)=>per[Math.min(learnDays.length-1,Math.floor(i*learnDays.length/goals.length))].push(g));
    let prev=[];
    learnDays.forEach((d,i)=>{
      const items=[];
      if(prev.length) items.push({key:`${test.id}|${d}|rep`,kind:'review',text:'Kurz wiederholen: '+prev.map(g=>g.text).join(', '),min:10});
      per[i].forEach(g=>items.push({key:`${test.id}|${d}|${g.id}`,kind:'study',text:g.text,min:30}));
      if(!per[i].length && i===learnDays.length-1) items.push({key:`${test.id}|${d}|ueb`,kind:'study',text:'Übungsaufgaben zu allen Lernzielen',min:30});
      if(per[i].length) prev=per[i];
      if(items.length) out.push({date:d,items});
    });
  }
  if(review>=T) out.push({date:review,items:[{key:`${test.id}|${review}|final`,kind:'review',text:'Nur wiederholen: Zusammenfassung lesen, Fehler anschauen, früh schlafen',min:30}]});
  return out;
}
function studyOn(s){
  const res=[];
  S.tests.filter(t=>t.date>=s).forEach(t=>{
    const day=studyPlan(t).find(p=>p.date===s);
    if(day) day.items.forEach(it=>res.push({...it,test:t}));
  });
  return res;
}
/* Lernsessions auf freie Zeit zwischen 05:30 und 21:30 verteilen, mit Puffer um Schule und Hobbys */
const STUDY_FROM=5*60+30, STUDY_TO=21*60+30, BUF=10;
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const _sched={};
function scheduleStudy(s){
  const items=studyOn(s); if(!items.length) return [];
  const sig=s+JSON.stringify(items.map(i=>i.key))+JSON.stringify(lessonsOn(s).concat(hobbiesOn(s),eventsOn(s)).map(x=>[x.start,x.end,x.days]));
  if(_sched[s]?.sig===sig) return _sched[s].out;
  const busy=[...lessonsOn(s),...hobbiesOn(s),...eventsOn(s).filter(e=>e.start).map(e=>({start:e.start,end:e.end||hm(Math.min(tmin(e.start)+60,1439))}))].map(x=>[tmin(x.start)-BUF,tmin(x.end)+BUF]).sort((a,b)=>a[0]-b[0]);
  let free=[],cur=STUDY_FROM;
  for(const[a,b] of busy){if(a>cur)free.push([cur,Math.min(a,STUDY_TO)]);cur=Math.max(cur,b)}
  if(cur<STUDY_TO)free.push([cur,STUDY_TO]);
  free=free.filter(f=>f[1]-f[0]>=15);
  const total=free.reduce((x,f)=>x+f[1]-f[0],0); const n=items.length;
  const out=items.map((it,k)=>{
    const len=it.min; let off=total*(k+0.5)/n-len/2, abs=free.length?free[0][0]:STUDY_FROM, acc=0;
    for(const f of free){const L=f[1]-f[0];if(off<acc+L){abs=f[0]+Math.max(0,off-acc);break}acc+=L;abs=f[1]}
    let best=null;
    free.forEach((f,i)=>{if(f[1]-f[0]<len)return;let st=Math.min(Math.max(abs,f[0]),f[1]-len);
      st=Math.round(st/5)*5;if(st<f[0])st+=5;if(st+len>f[1])st-=5;if(st<f[0])return;
      const d=Math.abs(st-abs);if(!best||d<best.d)best={d,st,i}});
    if(!best) return {...it,start:null};
    const f=free[best.i],st=best.st,en=st+len;
    free.splice(best.i,1,[f[0],st-5],[en+5,f[1]]); free=free.filter(x=>x[1]-x[0]>=15);
    return {...it,start:hm(st),end:hm(en)};
  });
  out.sort((a,b)=>(a.start||'99')<(b.start||'99')?-1:1);
  _sched[s]={sig,out}; return out;
}
function nextHoliday(){
  const T=todayS();
  for(const h of HOLIDAYS){ if(T>=h[1]&&T<=h[2]) return {name:h[0],now:true,end:h[2]}; if(h[1]>T) return {name:h[0],start:h[1],end:h[2],days:diffDays(T,h[1])}; }
  return null;
}
function sleepHours(h){ if(!h?.bed||!h?.wake) return null; let m=tmin(h.wake)-tmin(h.bed); if(m<=0)m+=1440; return m/60 }

function sleepTip(T){
  const tomorrow=addDays(T,1);
  const first=lessonsOn(tomorrow)[0];
  if(!first) return `<div class="need" style="margin-top:12px">Morgen keine Schule. Versuch trotzdem, nicht mehr als 1 Stunde später als sonst schlafen zu gehen.</div>`;
  const wake=tmin(first.start)-75; const bed=wake-S.settings.sleepGoal*60;
  const hm=m=>{m=(m+1440)%1440;return `${pad(Math.floor(m/60))}:${pad(m%60)}`};
  const late=hobbiesOn(T).some(h=>tmin(h.end)>=21*60);
  return `<div class="need" style="margin-top:12px"><b>Schlafplan für heute Nacht</b><span>Morgen erste Stunde ${first.start}. Für ${S.settings.sleepGoal} h Schlaf: <span class="hl">um ${hm(bed)} schlafen</span>, Wecker ${hm(wake)}.${late?' Nach dem Hobby direkt duschen und Handy weglegen.':''}</span><div><button class="btn sm" data-go="schlaf">Abendroutine & Schlaf</button></div></div>`;
}
function hDone(d,id){const v=S.habitLog[d]?.[id];return v===undefined?!!S.exHabit?.[d]?.[id]:!!v}
function streak(hid){let n=0,d=todayS(); if(!hDone(d,hid)) d=addDays(d,-1); while(hDone(d,hid)){n++;d=addDays(d,-1)} return n}
function goalsSection(){

  const sl=[];for(let i=1;i<=7;i++){const h=sleepHours(S.health[addDays(T,-i+1)]);if(h)sl.push(h)}
  const sAvg=sl.length?sl.reduce((a,b)=>a+b,0)/sl.length:null;

function needText(s,target,w){

  if(n<=1) return `<span class="g-good">Schaffst du sicher, sogar mit einer 1.</span>`;
  return `Du brauchst mindestens eine <b class="grade ${gradeClass(n)}">${(Math.ceil(n*4)/4).toFixed(2)}</b> <span style="color:var(--muted)">(genau ${n.toFixed(2)})</span>`;
}

function dayChips(s,compact){
  const sched=compact?[]:scheduleStudy(s);
  const out=[]; const h=holidayOn(s); if(h) out.push(`<div class="ev-chip hol">${esc(h)}</div>`);
  S.tests.filter(t=>t.date===s).forEach(t=>out.push(`<div class="ev-chip test" title="${esc(t.title)}">Test ${esc(t.subject)}</div>`));
  S.tasks.filter(t=>t.due===s&&!t.done).forEach(t=>out.push(`<div class="ev-chip task" title="${esc(t.note||'')}">${esc(t.title)}</div>`));
  const st=compact?studyOn(s):sched.filter(x=>!x.start); const bySub={};
  st.forEach(it=>{const k=it.test.subject+'|'+it.kind;bySub[k]=bySub[k]||{n:0,it};bySub[k].n++});
  Object.values(bySub).forEach(({it})=>out.push(`<div class="ev-chip ${it.kind==='review'?'review':'study'}" title="${esc(it.text)}">${it.kind==='review'?'Wdh.':'Lernen'} ${esc(it.test.subject)}</div>`));
  eventsOn(s).filter(e=>compact||!e.start).forEach(e=>out.push(`<div class="ev-chip ev" style="--c:${evColor(e)}" data-act="editEvent" data-id="${e.id}" title="${esc(e.title)}">${compact&&e.start?e.start+' ':''}${esc(e.title)}</div>`));
  (S.absences||[]).filter(a=>a.date===s).forEach(a=>out.push(`<div class="ev-chip abs">${a.kind==='spaet'?'Verspätung':'Absenz'}</div>`));
  if(compact) hobbiesOn(s).forEach(hb=>out.push(`<div class="ev-chip" style="background:var(--hl-soft)">${esc(hb.name)}</div>`));
  return out.join('');
}
function weekView(){
  const mon=mondayOf(calAnchor); const T=todayS();
  const H0=5*60, H1=22*60+30, PX=0.85; const height=(H1-H0)*PX;
  const end=addDays(mon,6); const pm=pd(mon), pe=pd(end);
  let cols='<div class="wk-h" style="border-left:0"></div>', all='<div class="wk-all" style="border-left:0"></div>', body=`<div class="wk-time" style="height:${height}px">`;
  for(let h=6;h<=22;h++) body+=`<span style="top:${(h*60-H0)*PX}px">${h}:00</span>`;
  body+='</div>';
  for(let i=0;i<7;i++){
    const s=addDays(mon,i); const d=pd(s); const hol=schoolFree(s);
    cols+=`<div class="wk-h ${s===T?'today':''} ${hol?'hol':''}">${DAYS[i]}<b>${d.getDate()}.${d.getMonth()+1}.</b></div>`;
    all+=`<div class="wk-all" data-mday="${s}">${dayChips(s)}</div>`;
    let blocks='';
    lessonsOn(s).forEach(l=>{blocks+=`<div class="blk lesson" data-act="lessonClick" data-day="${s}" data-start="${l.start}" data-end="${l.end}" data-sub="${esc(l.subject)}" title="${esc(l.subject)}: tippen für Aufgabe oder Absenz" style="top:${(tmin(l.start)-H0)*PX}px;height:${Math.max(16,(tmin(l.end)-tmin(l.start))*PX-2)}px;background:${colorOf(l.subject)}"><b>${esc({'Finanz- und Rechnungswesen':'FRW','Wirtschaft und Recht':'Wirtschaft & Recht'}[l.subject]||l.subject)}</b>${l.room?esc(l.room):''}</div>`});
    scheduleStudy(s).filter(x=>x.start).forEach(x=>{const done=S.studyDone[x.key];blocks+=`<div class="blk ${x.kind==='review'?'rev':'study'} ${done?'sdone':''}" title="${esc(x.text)}" style="top:${(tmin(x.start)-H0)*PX}px;height:${Math.max(16,x.min*PX-2)}px"><b>${x.kind==='review'?'Wdh.':'Lernen'} ${esc(x.test.subject)}</b>${esc(x.text)}</div>`});
    hobbiesOn(s).forEach(h=>{blocks+=`<div class="blk hobby" style="top:${(tmin(h.start)-H0)*PX}px;height:${Math.max(16,(tmin(h.end)-tmin(h.start))*PX-2)}px"><b>${esc(h.name)}</b>${h.start}–${h.end}</div>`});
    eventsOn(s).filter(e=>e.start).forEach(e=>{const en=e.end?tmin(e.end):tmin(e.start)+60;blocks+=`<div class="blk ev" data-act="editEvent" data-id="${e.id}" title="${esc(e.title)}" style="--c:${evColor(e)};top:${(tmin(e.start)-H0)*PX}px;height:${Math.max(18,(en-tmin(e.start))*PX-2)}px"><b>${esc(e.title)}</b>${e.start}${e.end?'–'+e.end:''}</div>`});
    if(s===T){const n=new Date();const m=n.getHours()*60+n.getMinutes();if(m>H0&&m<H1)blocks+=`<div class="nowline" style="top:${(m-H0)*PX}px"></div>`}
    body+=`<div class="wk-col ${hol?'hol':''}" data-day="${s}" style="height:${height}px;--hour:${60*PX}px;background-position:0 ${(60-(H0%60))*PX}px">${blocks}</div>`;
  }
  return `<div class="calbar"><div class="calnav"><button class="btn sm" data-act="calPrev" aria-label="Vorherige Woche">‹</button><b>${pm.getDate()}.${pm.getMonth()+1}. – ${pe.getDate()}.${pe.getMonth()+1}.${pe.getFullYear()}</b><button class="btn sm" data-act="calNext" aria-label="Nächste Woche">›</button><button class="btn sm" data-act="calToday">Heute</button></div>
   <div style="display:flex;gap:6px"><button class="btn sm" data-act="addTask">+ Aufgabe</button><button class="btn sm" data-act="addTest">+ Test</button></div></div>
   <div class="scrollx"><div class="week">${cols}${all}${body}</div></div>`;
}

const PCOMP=[['lern','Lernziele','--p1'],['zeit','Lernzeit','--p2'],['hab','Gewohnheiten','--p3'],['auf','Aufgaben','--p4']];
const JTYPES={erkenntnis:['Erkenntnis','--p1'],idee:['Idee','--p4'],gelernt:['Gelernt','--p3']};
let progWeek=mondayOf(todayS()), jFilter='alle', jType='erkenntnis';
function weekStats(mon){
  const T=todayS(), sun=addDays(mon,6), last=sun<T?sun:T, inW=d=>d>=mon&&d<=sun;
  const days=[];for(let d=mon;d<=last;d=addDays(d,1))days.push(d);
  const sessions=Object.entries(S.studyDone).filter(([k,v])=>v&&inW(k.split('|')[1])).length;
  const minutes=S.studyLog.filter(l=>inW(l.date)).reduce((a,l)=>a+(+l.min||0),0);
  let hOn=0,hTot=0;const dH=S.habits.filter(isDaily);hTot=dH.length*days.length;days.forEach(d=>dH.forEach(h=>{if(hDone(d,h.id))hOn++}));
  S.habits.filter(h=>!isDaily(h)).forEach(h=>{const tg=Math.max(1,Math.round(h.target*Math.max(1,days.length)/7));hTot+=tg;hOn+=Math.min(tg,days.filter(d=>hDone(d,h.id)).length)});
  const tw=S.tasks.filter(t=>inW(t.due)&&t.due<=last), tDone=tw.filter(t=>t.done).length;
  const frac=Math.max(1,days.length)/7; // laufende Woche: Ziel anteilig
  const r={lern:Math.min(1,sessions/(S.settings.sessionGoal*frac)),zeit:Math.min(1,minutes/(S.settings.minuteGoal*frac)),hab:hTot?hOn/hTot:0,auf:tw.length?tDone/tw.length:1};
  const parts={};let score=0;PCOMP.forEach(([k])=>{parts[k]=r[k]*25;score+=parts[k]});
  return {mon,sun,days,sessions,minutes,hOn,hTot,tw,tDone,r,parts,score:Math.round(score),future:mon>T};
}
const fmtMin=m=>m>=60?`${Math.floor(m/60)} h ${m%60?pad(m%60)+' min':''}`.trim():`${m} min`;
function scoreRing(st,size=200,stroke=16){
  const R=(size-stroke)/2, C=2*Math.PI*R, gap=st.score>0?4:0; let off=0, arcs='';
  PCOMP.forEach(([k,,c])=>{const len=st.parts[k]/100*C; if(len>gap){arcs+=`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(${c})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${len-gap} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${PCOMP.find(p=>p[0]===k)[1]}: ${Math.round(st.parts[k])} von 25</title></circle>`} off+=len});
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Fortschritts-Score ${st.score} von 100"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/>${arcs}</svg>`;
}
function historyChart(){
  const T=todayS(); const weeks=[...Array(6)].map((_,i)=>weekStats(addDays(mondayOf(T),-7*(5-i))));
  const W=560,H=210,L=30,B=26,top=12,bw=(W-L)/6,y=v=>top+(H-top-B)*(1-v/100);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score der letzten 6 Wochen">`;
  [0,50,100].forEach(v=>s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  weeks.forEach((w,i)=>{const x=L+i*bw+bw*.22,bwid=bw*.56;let base=0;
    PCOMP.forEach(([k,lab,c],j)=>{const v=w.parts[k];if(v<=0.3)return;const y0=y(base),y1=y(base+v);base+=v;
      s+=`<rect x="${x}" y="${y1}" width="${bwid}" height="${Math.max(0,y0-y1-2)}" rx="3" fill="var(${c})"><title>${fmtShort(w.mon)}: ${lab} ${Math.round(v)}/25</title></rect>`});
    s+=`<text x="${x+bwid/2}" y="${y(base)-6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${w.score}</text>`;
    s+=`<text x="${x+bwid/2}" y="${H-8}" text-anchor="middle">${i===5?'diese Woche':pd(w.mon).getDate()+'.'+(pd(w.mon).getMonth()+1)+'.'}</text>`});
  return s+'</svg>';
}
function weekReview(st){
  const T=todayS(); const wins=[],missed=[],tips=[];
  if(st.tDone) wins.push(`${st.tDone} Aufgabe${st.tDone>1?'n':''} erledigt`);
  if(st.sessions) wins.push(`${st.sessions} Lernsession${st.sessions>1?'s':''} abgeschlossen`);
  if(st.minutes) wins.push(`${fmtMin(st.minutes)} gelernt`);
  const best=S.habits.filter(isDaily).map(h=>({h,n:st.days.filter(d=>hDone(d,h.id)).length})).sort((a,b)=>b.n-a.n);
  if(best[0]?.n) wins.push(`Stärkste Gewohnheit: ${esc(best[0].h.name)} (${best[0].n}/${st.days.length} Tage)`);
  const jn=S.journal.filter(j=>j.date>=st.mon&&j.date<=st.sun).length; if(jn) wins.push(`${jn} Einträge im Wissensjournal`);
  const prev=weekStats(addDays(st.mon,-7)); if(st.score>prev.score) wins.push(`Score ${st.score-prev.score} Punkte besser als letzte Woche`);
  st.tw.filter(t=>!t.done&&t.due<T).forEach(t=>missed.push(`Aufgabe verpasst: ${esc(t.title)} (${fmtShort(t.due)})`));
  best.filter(b=>st.days.length>=3&&b.n<st.days.length/2).forEach(b=>missed.push(`${esc(b.h.name)}: nur ${b.n} von ${st.days.length} Tagen`));
  if(st.r.zeit<1&&!st.future) tips.push(`Noch ${fmtMin(Math.max(0,S.settings.minuteGoal-st.minutes))} bis zu deinem Lernzeit-Ziel. Plane feste Blöcke im Kalender ein.`);
  const weak=best[best.length-1]; if(weak&&st.days.length&&weak.n<st.days.length) tips.push(`Fokus auf „${esc(weak.h.name)}“: verknüpfe es mit etwas, das du sowieso jeden Tag machst.`);
  const sl=st.days.map(d=>sleepHours(S.health[d])).filter(Boolean); if(sl.length){const a=sl.reduce((x,y)=>x+y,0)/sl.length;if(a<S.settings.sleepGoal)tips.push(`Im Schnitt ${a.toFixed(1)} h geschlafen. Ziel sind ${S.settings.sleepGoal} h: Handy früher weglegen.`)}
  const soon=S.tests.filter(t=>t.date>=T&&diffDays(T,t.date)<=7&&!S.studyLog.some(l=>l.subject===t.subject&&l.date>=st.mon)); soon.forEach(t=>tips.push(`Für den Test in ${esc(t.subject)} (${fmtShort(t.date)}) hast du diese Woche noch nichts eingetragen.`));
  const over=S.tasks.filter(t=>!t.done&&t.due<T&&t.due<st.mon).length; if(over) tips.push(`${over} ältere überfällige Aufgaben: erledige zuerst die mit „Sofort“.`);
  if(!tips.length) tips.push('Starke Woche! Behalte deinen Rhythmus bei.');
  return {wins,missed,tips};
}

/* ---------- Fokus-Timer (Pomodoro) ---------- */
const PH={focus:['Fokus'],short:['Kurze Pause'],long:['Lange Pause']};
const pset=()=>S.pomo.set;
const phDur=ph=>Math.round((ph==='focus'?pset().focus:ph==='short'?pset().short:pset().long)*60);
function prun(){if(!S.pomo.run)S.pomo.run={ph:'focus',rem:phDur('focus'),tot:phDur('focus'),ends:0,on:false,round:1,subject:'',what:''};return S.pomo.run}
function pLeft(){const r=prun();return r.on?Math.max(0,Math.round((r.ends-Date.now())/1000)):r.rem}
const mmss=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;
const LEVELS=['Fokus-Neuling','Tomaten-Sammler:in','Konzentrations-Profi','Deep-Work-Ninja','Lern-Legende','Fokus-Meister:in','Zeit-Magier:in','Unaufhaltsam'];
const lvlXp=n=>50*n*(n-1);
function lvlOf(xp){let n=1;while(xp>=lvlXp(n+1))n++;return {n,name:LEVELS[Math.min(n-1,LEVELS.length-1)],from:lvlXp(n),to:lvlXp(n+1)}}
function pomoDays(){const m={};S.pomo.log.forEach(l=>{m[l.date]=(m[l.date]||0)+1});return m}
function pomoStreak(){const m=pomoDays();let n=0,d=todayS();if(!m[d])d=addDays(d,-1);while(m[d]){n++;d=addDays(d,-1)}return n}
const BADGES=[
 ['🍅','Erste Tomate','1 Session',c=>c.total>=1],['⚡','Viererpack','4 an einem Tag',c=>c.maxDay>=4],
 ['🔥','3-Tage-Serie','3 Tage in Folge',c=>c.best>=3],['🌅','Frühstarter:in','Session vor 8 Uhr',c=>c.early],
 ['🗓️','Wochen-Held:in','7 Tage in Folge',c=>c.best>=7],['🏃','Marathon','8 an einem Tag',c=>c.maxDay>=8],
 ['⏱️','10 Stunden','10 h Fokus total',c=>c.min>=600],['🏆','50 Tomaten','50 Sessions total',c=>c.total>=50],
 ['💎','Fokus-Legende','50 h Fokus total',c=>c.min>=3000]];
function pomoStats(){const L=S.pomo.log,m=pomoDays();let best=0,cur=0,prev=null;Object.keys(m).sort().forEach(d=>{cur=prev&&addDays(prev,1)===d?cur+1:1;best=Math.max(best,cur);prev=d});
  return {total:L.length,min:L.reduce((a,l)=>a+l.min,0),maxDay:Math.max(0,...Object.values(m)),best,early:L.some(l=>l.at&&l.at<'08:00'),today:m[todayS()]||0}}
function pomoSet(ph){const r=prun();Object.assign(r,{ph,rem:phDur(ph),tot:phDur(ph),on:false,ends:0})}
function pomoStart(){const r=prun();if(r.on)return;if(r.rem<=0)r.rem=r.tot=phDur(r.ph);r.on=true;r.ends=Date.now()+r.rem*1000;unlockAudio()}
function pomoPause(){const r=prun();if(!r.on)return;r.rem=pLeft();r.on=false}
function pomoDone(skipped){
  const r=prun(), P=pset();
  if(r.ph==='focus'){
    if(!skipped){
      const min=Math.max(1,Math.round(r.tot/60)), now=new Date();
      const before=BADGES.filter(b=>b[3](pomoStats())).length;
      S.pomo.log.push({id:uid(),date:todayS(),at:`${pad(now.getHours())}:${pad(now.getMinutes())}`,min,subject:r.subject||'',what:r.what||''});
      S.studyLog.push({id:uid(),date:todayS(),subject:r.subject||'',what:'🍅 '+(r.what||'Fokus-Session'),min,pomo:1});
      let xp=min; if(r.round%P.rounds===0) xp+=15; S.pomo.xp+=xp;
      const after=BADGES.filter(b=>b[3](pomoStats()));
      beep(true); burst(); toast(`🍅 Geschafft! +${xp} XP`);
      if(after.length>before) setTimeout(()=>toast(`🏅 Neues Abzeichen: ${after[after.length-1][1]}`),2000);
      notify('Fokus-Session geschafft 🍅','Zeit für eine Pause.');
      const next=r.round%P.rounds===0?'long':'short'; r.round++; pomoSet(next);
    } else pomoSet('short');
  } else {
    if(!skipped){beep(false);notify('Pause vorbei','Bereit für die nächste Runde?')}
    if(r.ph==='long'||r.round>P.rounds) r.round=1;
    pomoSet('focus');
  }
  if(P.auto&&!skipped) pomoStart();
  save(); if(route==='fokus') render(); else renderNav();
}
function pomoPaint(){
  const r=S.pomo?.run; if(!r) return;
  const left=pLeft();
  const c=document.getElementById('pClock'); if(c) c.textContent=mmss(left);
  const ring=document.getElementById('pRing'); if(ring){const C=+ring.dataset.c;ring.style.strokeDashoffset=C*(1-left/Math.max(1,r.tot,left))}
  const chip=document.getElementById('navPomo'); if(chip) chip.textContent=mmss(left);
  try{document.title=r.on?`${mmss(left)} · ${PH[r.ph][0]}`:'Mein Schulplaner'}catch(e){}
}
setInterval(()=>{const r=S.pomo?.run;if(!r||!r.on)return;if(pLeft()<=0)pomoDone();else pomoPaint()},500);
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(win){
  if(pset().sound!==false){try{unlockAudio();if(AC){(win?[523,659,784,1047]:[784,523]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.17;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.32);o.start(t);o.stop(t+.34)})}}catch(e){}}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function notify(t,b){try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)new Notification(t,{body:b})}catch(e){}}
function burst(){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const el=document.getElementById('pClock'); const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  for(let i=0;i<16;i++){const s=document.createElement('span');s.className='burst';s.textContent=['🍅','⭐','✨','🎉'][i%4];const a=Math.random()*Math.PI*2,d=90+Math.random()*120;
    s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
}
function vFokus(){

  const first=lessonsOn(addDays(d,1))[0];
  const wake=first?tmin(first.start)-75:6*60+45+60;
  return wake+1440-S.settings.sleepGoal*60;
}
function routineRatio(d){const RL=S.routineLog[d]||{};return S.routine.length?S.routine.filter(s=>RL[s.id]).length/S.routine.length:0}
function routineStreak(){let n=0,d=todayS();if(routineRatio(d)<.8)d=addDays(d,-1);while(routineRatio(d)>=.8&&n<400){n++;d=addDays(d,-1)}return n}

  const RL=S.routineLog[T]||{}, steps=[...S.routine].sort((a,b)=>b.before-a.before), done=steps.filter(s=>RL[s.id]).length;

    <div class="ring-c"><span class="mono" style="font-size:34px">${avg?avg.toFixed(1):'–'}</span><small>von ${goal} h</small></div></div>

  <div class="grid g2">
   <section class="card"><div class="hd"><h2>Schlaf eintragen</h2>${sh?`<button class="btn sm ghost danger" data-act="sDel">Eintrag löschen</button>`:''}</div>

/* ---------- Wochen-Habits ---------- */

function weekStreakH(h){let n=0,mon=mondayOf(todayS());if(weekCount(h,mon)<h.target)mon=addDays(mon,-7);while(weekCount(h,mon)>=h.target&&n<300){n++;mon=addDays(mon,-7)}return n}
function weeklyCard(){

      <div class="wdots" style="margin-top:8px">${[...Array(7)].map((_,i)=>{const d=addDays(mon,i),on=hDone(d,h.id);return `<button class="wdot ${on?'on':''} ${d===T?'today':''}" style="${on?`background:${h.color}`:''}" data-act="toggleHabit" data-id="${h.id}" data-date="${d}" aria-pressed="${on}" aria-label="${esc(h.name)} ${DAYS_LONG[i]}" ${d>T?'disabled':''}>${DAYS[i]}</button>`}).join('')}</div>

       <button class="icon-btn" data-act="delHabit" data-id="${h.id}" aria-label="Habit löschen" style="margin-top:4px">${I.trash}</button></div></div>`}).join('')||'<div class="empty">Noch keine Wochen-Habits.</div>'}

/* ---------- Absenzen ---------- */
function lessonsBetween(a,b){const c={};let g=0;for(let d=a;d<=b&&g++<800;d=addDays(d,1))lessonsOn(d).forEach(l=>{c[l.subject]=(c[l.subject]||0)+1});return c}
const ABS_ST={offen:['Entschuldigung offen','p-warn'],ent:['entschuldigt','p-good'],unent:['unentschuldigt','p-bad']};
function vAbsenzen(){
  const T=todayS(), from=S.settings.absStart;
  const list=S.absences.filter(a=>a.date>=from).sort((a,b)=>a.date<b.date?1:-1);
  const abs=list.filter(a=>a.kind!=='spaet'), late=list.filter(a=>a.kind==='spaet');
  const planned=lessonsBetween(from,T); const missed={};
  abs.forEach(a=>a.lessons.forEach(l=>{if(a.date<=T)missed[l.subject]=(missed[l.subject]||0)+1}));
  const tp=Object.values(planned).reduce((a,b)=>a+b,0), tm=Object.values(missed).reduce((a,b)=>a+b,0);
  const att=tp?Math.max(0,100-tm/tp*100):100;
  const open=S.absences.filter(a=>a.status==='offen');
  const subs=[...new Set([...Object.keys(planned),...Object.keys(missed)])].sort((a,b)=>a.localeCompare(b,'de'));

function migrate3(){const F=S.fin;if(!F)return;F.pay=F.pay||[];F.rules=F.rules||[];
  if(!F.rulesMig){if(F.autoPct>0&&F.autoPot)F.rules.push({id:uid(),cat:'alle',mode:'pct',value:F.autoPct,pot:F.autoPot});F.autoPct=0;F.rulesMig=1}}
const payDate=(ym,day)=>{const[y,m]=ym.split('-').map(Number);return `${ym}-${pad(Math.min(day,new Date(y,m,0).getDate()))}`};
const nextYm=ym=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
function payNext(p){const T=todayS(),ym=T.slice(0,7),d=payDate(ym,p.day);return (d<T||d<p.since||(p.last&&p.last>=ym))?payDate(nextYm(ym),p.day):d}
function applyRules(t){
  const F=S.fin;let tot=0;t.parts=[];
  F.rules.filter(r=>r.cat==='alle'||r.cat===t.cat).forEach(r=>{if(!potById(r.pot))return;const left=r2(t.amount-tot);
    let v=r.mode==='pct'?r2(t.amount*r.value/100):r.value;v=r2(Math.max(0,Math.min(v,left)));
    if(v>0){const got=potAdd(r.pot,v,'Sparregel');if(got){t.parts.push({pot:r.pot,amt:got});tot=r2(tot+got)}}});
  if(tot)t.auto=tot;return tot;
}
function finAutoBook(){
  const F=S.fin;if(!F?.pay?.length)return;const T=todayS(),cur=T.slice(0,7);const msgs=[];
  F.pay.forEach(p=>{for(let k=2;k>=0;k--){const x=pd(cur+'-01');x.setMonth(x.getMonth()-k);const ym=ds(x).slice(0,7),d=payDate(ym,p.day);
    if(d>T||d<p.since||(p.last&&p.last>=ym))continue;
    const t={id:uid(),date:d,amount:p.amount,cat:p.cat,note:p.name+' (automatisch)',autoPay:p.id};const sv=applyRules(t);F.tx.push(t);p.last=ym;
    msgs.push(`${p.name}: +${CHF(p.amount)}${sv?`, davon ${CHF(sv)} gespart`:''}`)}});
  if(msgs.length){save();setTimeout(()=>toast('💰 '+msgs.join(' · ')),400)}
}
function ruleText(r){const p=potById(r.pot);return `${r.cat==='alle'?'Von jeder Einnahme':'Von '+FX(r.cat)[0]}: <b class="money">${r.mode==='pct'?r.value+' %':CHF(r.value)}</b> → ${p?p.emoji+' '+esc(p.name):'<span class="g-bad">Sparziel fehlt</span>'}`}
function autoCard(F,auto){
  const T=todayS(), ym=T.slice(0,7);
  const out=-F.tx.filter(t=>t.date.startsWith(ym)&&t.amount<0).reduce((a,t)=>a+t.amount,0);
  const payM=F.pay.reduce((a,p)=>a+p.amount,0);
  const saveM=F.pay.reduce((a,p)=>{let tot=0;F.rules.filter(r=>r.cat==='alle'||r.cat===p.cat).forEach(r=>{tot+=Math.max(0,Math.min(r.mode==='pct'?p.amount*r.value/100:r.value,p.amount-tot))});return a+tot},0);
  const subsM=F.subs.reduce((a,s)=>a+subMonthly(s),0);
  const sugg=Math.max(0,Math.floor((payM-saveM-subsM)/5)*5);
  const hd=t=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><b style="font-size:15px">${t[0]}</b>${t[1]||''}</div>`;
  return `<section class="card"><div class="hd"><h2>Automatisch sparen</h2>${auto?`<span class="pill p-good">${CHF(auto)} bisher</span>`:''}</div>
   ${F.pots.length?'':'<p class="s" style="margin:0 0 10px;color:var(--warn);font-size:13px">Erstelle zuerst ein Sparziel, dann kann das Geld dorthin fliessen.</p>'}
   <div style="display:flex;flex-direction:column;gap:16px">
    <div>${hd(['📅 Zahltage',`<button class="btn sm" data-act="payNew">+ Zahltag</button>`])}
     <div class="s" style="font-size:12.5px;color:var(--muted);margin-bottom:6px">An diesem Tag wird dein Taschengeld oder Lohn automatisch eingetragen, und deine Sparregeln laufen sofort.</div>
     <div class="list">${F.pay.map(p=>`<div class="row"><span style="font-size:20px">${FX(p.cat)[1]}</span><div class="main"><div class="t">${esc(p.name)} · <span class="money">${CHF(p.amount)}</span></div><div class="s">jeden ${p.day}. im Monat · nächstes Mal ${fmtShort(payNext(p))}</div></div><button class="icon-btn" data-act="payDel" data-id="${p.id}" aria-label="Zahltag löschen">${I.trash}</button></div>`).join('')||'<div class="empty" style="padding:6px 2px">Noch kein Zahltag. Z. B. Taschengeld am 1. jeden Monats.</div>'}</div></div>
    <div>${hd(['🐷 Sparregeln',`<button class="btn sm" data-act="ruleNew">+ Regel</button>`])}
     <div class="s" style="font-size:12.5px;color:var(--muted);margin-bottom:6px">Bei jeder passenden Einnahme kommt dieser Betrag zuerst ins Sparziel. Danach gibst du den Rest aus.</div>
     <div class="list">${F.rules.map(r=>`<div class="row"><div class="main"><div class="t" style="font-weight:500">${ruleText(r)}</div></div><button class="icon-btn" data-act="ruleDel" data-id="${r.id}" aria-label="Regel löschen">${I.trash}</button></div>`).join('')||'<div class="empty" style="padding:6px 2px">Noch keine Regel. Z. B. von Taschengeld CHF 60 ins Sparziel.</div>'}</div></div>
    <div>${hd(['💳 Monatsbudget'])}
     <div class="inl2">CHF <input type="number" id="finBudget" min="0" step="5" value="${F.budget||''}" placeholder="z. B. 80" style="width:90px"> für Ausgaben pro Monat ${payM&&sugg&&sugg!==F.budget?`<button class="btn sm" data-act="budgetSugg" data-v="${sugg}">Vorschlag: ${CHF(sugg)}</button>`:''}</div>
     ${payM?`<div class="s" style="font-size:12.5px;color:var(--muted);margin-top:6px">Pro Monat: ${CHF(payM)} rein, ${CHF(saveM)} gespart, ${CHF(subsM)} Abos, also bleiben ${CHF(payM-saveM-subsM)} zum Ausgeben.</div>`:''}
     ${F.budget?`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,out/F.budget*100)}%;background:${out>F.budget?'var(--bad)':out>F.budget*.8?'var(--warn)':'var(--accent)'}"></i></div><div class="s" style="font-size:12.5px;margin-top:4px;color:${out>F.budget?'var(--bad)':'var(--ink2)'}">${out>F.budget?`${CHF(out-F.budget)} über dem Budget`:`Noch ${CHF(F.budget-out)} übrig diesen Monat`}</div>`:''}</div>
    <div><label class="chk"><input type="checkbox" id="finRound" ${F.roundup.on?'checked':''}> <b>Aufrunden</b></label><div class="s" style="font-size:12.5px;color:var(--muted);margin:2px 0 6px 26px">Jede Ausgabe wird auf den nächsten Franken aufgerundet, die Differenz kommt ins Sparziel. CHF 4.30 → 70 Rp. gespart.</div><div class="inl2" style="margin-left:26px"><select id="finRoundPot">${potSel(F.roundup.pot)}</select></div></div>
   </div></section>`;
}

  const st=pomoStats(), g=S.pomo.set.goal||4, T=todayS(), RL=S.routineLog[T]||{}, rd=S.routine.filter(s=>RL[s.id]).length, bt=bedTarget(T);

/* ---------- Dialog ---------- */
function openDialog(title,fields,onSubmit,submitLabel='Speichern'){
  const f=document.getElementById('dlgForm');
  f.innerHTML=`<h2>${title}</h2><div class="form">${fields}</div><div class="acts"><button class="btn" value="cancel" type="button" data-act="dlgClose">Abbrechen</button><button class="btn pri" value="ok">${submitLabel}</button></div>`;
  f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const data=Object.fromEntries(fd);if(onSubmit(data,fd)!==false){document.getElementById('dlg').close();save();render()}};
  document.getElementById('dlg').showModal();
  f.querySelector('input,select,textarea')?.focus();
}
const subjOptions=(sel,allowEmpty)=>`${allowEmpty?'<option value="">– kein Fach –</option>':''}${subjects().map(s=>`<option ${s===sel?'selected':''}>${esc(s)}</option>`).join('')}`;
function dlgTask(){
  openDialog('Neue Aufgabe',`<label class="f full">Titel<input name="title" required></label>
   <label class="f">Fach<select name="subject">${subjOptions('',true)}</select></label>
   <label class="f">Fällig am<input type="date" name="due" value="${todayS()}" required></label>
   <label class="f">Priorität<select name="prio"><option value="hoch">Sofort</option><option value="mittel" selected>Einplanen</option><option value="tief">Später</option></select></label>
   <label class="f full">Notiz<input name="note"></label>`,
   d=>{S.tasks.push({id:uid(),title:d.title.trim(),note:d.note,subject:d.subject,due:d.due,prio:d.prio,done:false});toast('Aufgabe hinzugefügt')});
}
function dlgTest(t){
  openDialog(t?'Test bearbeiten':'Neuer Test',`<label class="f full">Titel<input name="title" required value="${esc(t?.title||'')}" placeholder="z. B. Prüfung Kapitel 4"></label>
   <label class="f">Fach<select name="subject" required>${subjOptions(t?.subject)}</select></label>
   <label class="f">Datum<input type="date" name="date" required value="${t?.date||addDays(todayS(),7)}"></label>
   <label class="f">Gewichtung<input type="number" name="weight" step="0.01" min="0.01" max="1" list="wList" value="${t?.weight??1}"></label>
   <label class="f full">Lernziele (eins pro Zeile)<textarea name="goals" placeholder="z. B.&#10;Vokabeln Unit 6&#10;Grammatik: if-clauses&#10;Text zusammenfassen">${t?esc(t.goals.map(g=>g.text).join('\n')):''}</textarea></label>`,
   d=>{const goals=d.goals.split('\n').map(x=>x.trim()).filter(Boolean);
     if(t){const old=t.goals;Object.assign(t,{title:d.title,subject:d.subject,date:d.date,weight:+d.weight||1,goals:goals.map(x=>old.find(g=>g.text===x)||{id:uid(),text:x})})}
     else S.tests.push({id:uid(),title:d.title.trim(),subject:d.subject,date:d.date,weight:+d.weight||1,goals:goals.map(x=>({id:uid(),text:x}))});
     toast('Lernplan erstellt')});
}
function dlgGrade(sub,title,weight){
  openDialog('Note eintragen',`<label class="f">Fach<select name="subject">${subjOptions(sub)}</select></label>
   <label class="f">Note (1–6)<input type="text" name="value" inputmode="decimal" pattern="[1-6]([.,][0-9]{1,2})?" title="Zahl zwischen 1 und 6, z. B. 4,78" placeholder="z. B. 4,78" required></label>
   <label class="f">Gewichtung<input type="number" name="weight" step="0.01" min="0.01" max="1" list="wList" value="${weight||1}"></label>
   <label class="f">Datum<input type="date" name="date" value="${todayS()}"></label>
   <label class="f full">Titel<input name="title" value="${esc(title||'')}" placeholder="z. B. Prüfung Algebra"></label>`,
   d=>{const v=Math.round(parseFloat(String(d.value).replace(',','.'))*100)/100;if(!(v>=1&&v<=6)){toast('Note muss zwischen 1 und 6 liegen, z. B. 3,2 oder 4,78');return false}
     if(!(+d.weight>0&&+d.weight<=1)){toast('Gewichtung muss zwischen 0.01 und 1 liegen');return false}
     S.grades.push({id:uid(),subject:d.subject,value:v,weight:+d.weight||1,date:d.date,title:d.title});toast('Note gespeichert')});
}

let toastT; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

    rDel:()=>{S.routine=S.routine.filter(x=>x.id!==id)},
    rAdd:()=>{openDialog('Neuer Schritt',`<label class="f full">Was machst du?<input name="text" required placeholder="z. B. 5 Min. Tagebuch"></label><label class="f">Minuten vor dem Schlafen<input type="number" name="before" min="0" max="240" step="5" value="15"></label>`,d=>{S.routine.push({id:uid(),text:d.text.trim(),before:+d.before||0})});return 'nr'},
    potNew:()=>{openDialog('Neues Sparziel',`<label class="f full">Wofür sparst du?<input name="name" required placeholder="z. B. neue Kopfhörer"></label>
      <label class="f">Zielbetrag (CHF)<input name="target" inputmode="decimal" required placeholder="z. B. 250"></label><label class="f">Bis wann? (optional)<input type="date" name="deadline"></label>
      <label class="f">Symbol<select name="emoji">${POT_EM.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="f">Schon gespart (CHF)<input name="saved" inputmode="decimal" placeholder="0"></label>`,
      d=>{const t=parseAmt(d.target);if(!(t>0)){toast('Bitte einen Zielbetrag eingeben');return false}S.fin.pots.push({id:uid(),name:d.name.trim(),target:t,saved:parseAmt(d.saved)||0,deadline:d.deadline||'',emoji:d.emoji,color:POT_COL[S.fin.pots.length%POT_COL.length],hist:[]});toast('Sparziel erstellt')});return 'nr'},
    potIn:()=>{const p=potById(id);dlgAmount(`${p.emoji} ${esc(p.name)}: einzahlen`,'Betrag (CHF)',a=>{potAdd(id,a,'Einzahlung');toast(p.saved>=p.target?'🎉 Sparziel erreicht!':`${CHF(a)} gespart`)});return 'nr'},
    potOut:()=>{const p=potById(id);dlgAmount(`${p.emoji} ${esc(p.name)}: abheben`,'Betrag (CHF)',a=>{potAdd(id,-a,'Abhebung');toast('Abgehoben')});return 'nr'},
    potDel:()=>{S.fin.pots=S.fin.pots.filter(p=>p.id!==id)},
    txDel:()=>{const t=S.fin.tx.find(x=>x.id===id);if(t?.round&&t.roundPot)potAdd(t.roundPot,-t.round,'Storno');if(t?.parts)t.parts.forEach(x=>potAdd(x.pot,-x.amt,'Storno'));else if(t?.auto&&t.autoPot)potAdd(t.autoPot,-t.auto,'Storno');S.fin.tx=S.fin.tx.filter(x=>x.id!==id)},
    fmPrev:()=>{const[y,m]=finMonth.split('-').map(Number);const d=new Date(y,m-2,1);finMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`},
    fmNext:()=>{const[y,m]=finMonth.split('-').map(Number);const d=new Date(y,m,1);const n=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;if(n<=todayS().slice(0,7))finMonth=n},
    subNew:()=>{openDialog('Neues Abo',`<label class="f full">Name<input name="name" required placeholder="z. B. Spotify"></label><label class="f">Preis (CHF)<input name="price" inputmode="decimal" required placeholder="z. B. 12.95"></label>
      <label class="f">Wie oft?<select name="interval"><option value="monat">pro Monat</option><option value="jahr">pro Jahr</option><option value="woche">pro Woche</option></select></label><label class="f">Nächste Zahlung<input type="date" name="next" value="${todayS()}"></label>`,
      d=>{const p=parseAmt(d.price);if(!(p>0)){toast('Bitte einen Preis eingeben');return false}S.fin.subs.push({id:uid(),name:d.name.trim(),price:p,interval:d.interval,next:d.next||todayS(),cut:false});toast('Abo gespeichert')});return 'nr'},
    subCut:()=>{const x=S.fin.subs.find(s=>s.id===id);x.cut=!x.cut},
    subDel:()=>{S.fin.subs=S.fin.subs.filter(s=>s.id!==id)},
    chStart:()=>{const k=b.dataset.k,T=todayS();S.fin.ch[k]={w52:{start:mondayOf(T),factor:.5,done:{},pot:''},nospend:{goal:8,days:{}},verzicht:{log:[],pot:''},wish:{items:[]}}[k];toast('Challenge gestartet!')},
    chStop:()=>{delete S.fin.ch[b.dataset.k];toast('Challenge beendet')},
    w52:()=>{const c=S.fin.ch.w52,n=+b.dataset.n,amt=r2(n*(c.factor||.5));if(c.done[n]){delete c.done[n];if(c.pot)potAdd(c.pot,-amt,'52 Wochen')}else{c.done[n]=1;if(c.pot)potAdd(c.pot,amt,'52 Wochen');toast(`Woche ${n}: ${CHF(amt)} gespart`)}},
    nsDay:()=>{const c=S.fin.ch.nospend,d=b.dataset.d;if(c.days[d])delete c.days[d];else{c.days[d]=1;toast('No-Spend-Tag! 💪')}},
    vzAdd:()=>{openDialog('Worauf hast du verzichtet?',`<label class="f full">Was?<input name="what" required placeholder="z. B. Energy-Drink am Kiosk"></label><label class="f">Betrag (CHF)<input name="amount" inputmode="decimal" required placeholder="z. B. 3.50"></label>`,
      d=>{const a=parseAmt(d.amount);if(!(a>0)){toast('Bitte einen Betrag eingeben');return false}const c=S.fin.ch.verzicht;c.log.push({date:todayS(),what:d.what.trim(),amount:a});if(c.pot)potAdd(c.pot,a,'Verzicht');toast(`Stark! ${CHF(a)} gespart`)});return 'nr'},
    wishAdd:()=>{openDialog('Neuer Wunsch',`<label class="f full">Was wünschst du dir?<input name="name" required placeholder="z. B. Sneakers"></label><label class="f">Preis (CHF)<input name="price" inputmode="decimal" required></label>`,
      d=>{const p=parseAmt(d.price);if(!(p>0)){toast('Bitte einen Preis eingeben');return false}S.fin.ch.wish.items.push({id:uid(),name:d.name.trim(),price:p,date:todayS(),status:'warten'});toast('Auf die Liste gesetzt. In 30 Tagen fragen wir nochmal.')});return 'nr'},
    wishDo:()=>{const x=S.fin.ch.wish.items.find(i=>i.id===id);x.status=b.dataset.s;toast(x.status==='nein'?`${CHF(x.price)} nicht ausgegeben 🎉`:'Viel Freude damit!')},
    bkExport:()=>{const txt=JSON.stringify(S);openDialog('Backup kopieren',`<label class="f full">Dein Backup<textarea id="bkTxt" readonly style="min-height:160px;font-family:var(--f-mono);font-size:11px">${esc(txt)}</textarea></label><p class="s full" style="margin:0;color:var(--muted);font-size:13px">Tipp auf „Kopieren“ und füg den Text in der App unter „Backup einfügen“ ein.</p>`,()=>{const ta=document.getElementById('bkTxt');try{navigator.clipboard.writeText(txt).then(()=>toast('Backup kopiert'),()=>{ta.select();document.execCommand('copy');toast('Backup kopiert')})}catch(e){ta.select();try{document.execCommand('copy')}catch(_){}toast('Backup kopiert')}},'Kopieren');return 'nr'},
    bkImport:()=>{openDialog('Backup einfügen',`<label class="f full">Backup-Text<textarea name="txt" required style="min-height:160px;font-family:var(--f-mono);font-size:11px" placeholder="Hier einfügen"></textarea></label><p class="s full" style="margin:0;color:var(--bad);font-size:13px">Achtung: Die Daten auf diesem Gerät werden durch das Backup ersetzt.</p>`,d=>{let x;try{x=JSON.parse(d.txt)}catch(e){toast('Das ist kein gültiges Backup');return false}if(!x||x.v!==1||!Array.isArray(x.tasks)){toast('Das ist kein gültiges Backup');return false}S=x;migrate();toast('Backup geladen')},'Laden');return 'nr'},
    payNew:()=>{const T=todayS();openDialog('Neuer Zahltag',`<label class="f full">Name<input name="name" required placeholder="z. B. Taschengeld"></label>
      <label class="f">Art<select name="cat">${Object.entries(FX_IN).map(([k,v])=>`<option value="${k}">${v[1]} ${v[0]}</option>`).join('')}</select></label>
      <label class="f">Betrag (CHF)<input name="amount" inputmode="decimal" required placeholder="z. B. 100"></label>
      <label class="f">Tag im Monat<input type="number" name="day" min="1" max="31" required value="1"></label>
      <label class="chk full"><input type="checkbox" name="now"> Für diesen Monat schon eintragen (falls der Tag schon war)</label>`,
      d=>{const a=parseAmt(d.amount),day=Math.round(+d.day);if(!(a>0)){toast('Bitte einen Betrag eingeben');return false}if(!(day>=1&&day<=31)){toast('Tag zwischen 1 und 31');return false}
        S.fin.pay.push({id:uid(),name:d.name.trim(),cat:d.cat,amount:a,day,since:d.now?T.slice(0,7)+'-01':T,last:''});toast('Zahltag gespeichert')});return 'nr'},
    payDel:()=>{S.fin.pay=S.fin.pay.filter(p=>p.id!==id)},
    ruleNew:()=>{if(!S.fin.pots.length){toast('Erstelle zuerst ein Sparziel');return 'nr'}openDialog('Neue Sparregel',`<label class="f full">Von welcher Einnahme?<select name="cat"><option value="alle">Jede Einnahme</option>${Object.entries(FX_IN).map(([k,v])=>`<option value="${k}" ${k==='tg'?'selected':''}>${v[1]} ${v[0]}</option>`).join('')}</select></label>
      <label class="f">Wie viel?<input name="value" inputmode="decimal" required placeholder="z. B. 60"></label>
      <label class="f">Einheit<select name="mode"><option value="fix">CHF</option><option value="pct">Prozent</option></select></label>
      <label class="f full">In welches Sparziel?<select name="pot">${potSel(S.fin.pots[0]?.id).replace(/<option value="">[^<]*<\/option>/,'')}</select></label>`,
      d=>{const v=parseAmt(d.value);if(!(v>0)||(d.mode==='pct'&&v>100)){toast('Bitte einen gültigen Betrag eingeben');return false}S.fin.rules.push({id:uid(),cat:d.cat,mode:d.mode,value:v,pot:d.pot});toast('Sparregel gespeichert')});return 'nr'},
    ruleDel:()=>{S.fin.rules=S.fin.rules.filter(r=>r.id!==id)},
    budgetSugg:()=>{S.fin.budget=+b.dataset.v;toast(`Budget: ${CHF(S.fin.budget)} pro Monat`)},
    clearEx:()=>{['timetable','grades','tasks','tests','studyLog','journal','goals'].forEach(k=>S[k]=S[k].filter(x=>!x.ex));S.exHabit={};for(const k in S.studyDone)if(S.studyDone[k]==='ex')delete S.studyDone[k];S.hasExamples=false;toast('Beispiele gelöscht')},
  };
  if(A[a]){ if(['setRed','setSleepGoal'].includes(a)) return; e.preventDefault(); if(A[a]()==='nr') return;
    if(['addTask','addTest','addGrade','editTest','addHabit','addSubject','gradeFromTest','dlgClose','addGoal'].includes(a)) return;
    save(); render(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.pset){const k=el.dataset.pset;if(k==='auto'||k==='sound')S.pomo.set[k]=el.checked;else{const v=+el.value;if(!(v>0))return;S.pomo.set[k]=v;const r=prun();if(!r.on&&r.rem===r.tot)pomoSet(r.ph)}save();render();return}
  if(el.id==='pSub'||el.id==='pWhat'){prun()[el.id==='pSub'?'subject':'what']=el.value;save();return}
  if(el.id==='sleepDate'){if(el.value&&el.value<=todayS()){sleepDate=el.value;render()}return}
  if(el.dataset.sleep){(S.health[sleepDate]=S.health[sleepDate]||{})[el.dataset.sleep]=el.value;save();render();return}
  if(el.id==='bedFixed'){S.settings.bedFixed=el.value;save();render();return}
  if(el.dataset.rbefore){const x=S.routine.find(r=>r.id===el.dataset.rbefore);if(x){x.before=Math.max(0,+el.value||0);save();render()}return}
  if(el.id==='absStart'){if(el.value){S.settings.absStart=el.value;save();render()}return}
  if(el.id==='absFrist'){const v=+el.value;if(v>0){S.settings.absFrist=v;save();render()}return}
  if(el.closest('#dlgForm')&&el.name==='date'){const box=document.getElementById('absLessons');if(box)box.innerHTML=absLessonsHtml(el.value);return}
  if(el.id==='finRound'){S.fin.roundup.on=el.checked;if(el.checked&&!S.fin.roundup.pot&&S.fin.pots[0])S.fin.roundup.pot=S.fin.pots[0].id;save();render();return}
  if(el.id==='finRoundPot'){S.fin.roundup.pot=el.value;save();return}
  if(el.id==='finBudget'){S.fin.budget=Math.max(0,+el.value||0);save();render();return}
  if(el.dataset.chpot){S.fin.ch[el.dataset.chpot].pot=el.value;save();return}
  if(el.id==='w52f'){S.fin.ch.w52.factor=+el.value;save();render();return}
  if(el.id==='nsGoal'){const v=+el.value;if(v>0){S.fin.ch.nospend.goal=v;save();render()}return}
  if(el.id==='goalSess'||el.id==='goalMin'){const v=+el.value;if(v>0){S.settings[el.id==='goalSess'?'sessionGoal':'minuteGoal']=v;save();render()}return}
  if(el.dataset.rev){(S.reviews[progWeek]=S.reviews[progWeek]||{})[el.dataset.rev]=el.value;save();return}
  if(el.id==='redBelow'){S.settings.redBelow=+el.value;save();render();return}
  if(el.id==='sleepGoal'){S.settings.sleepGoal=+el.value;save();render();return}
  const tr=el.closest('[data-lesson]');
  if(tr&&el.dataset.f){const l=S.timetable.find(x=>x.id===tr.dataset.lesson);l[el.dataset.f]=el.dataset.f==='day'?+el.value:el.value.trim();delete l.ex;save();if(el.dataset.f==='subject')render();return}
  const hr=el.closest('[data-hobby]');
  if(hr&&el.dataset.hf){const h=S.hobbies.find(x=>x.id===hr.dataset.hobby);h[el.dataset.hf]=el.value;save();return}
  if(el.dataset.health){const T=todayS();S.health[T]=S.health[T]||{};S.health[T][el.dataset.health]=el.dataset.health==='water'?+el.value:el.value;save();render();return}
});
document.addEventListener('submit',e=>{
  const f=e.target; if(f.id!=='logForm'&&f.id!=='jForm'&&f.id!=='finForm') return; e.preventDefault();
  const d=Object.fromEntries(new FormData(f));
  if(f.id==='finForm'){const a=parseAmt(d.amount);if(!(a>0)){toast('Bitte einen Betrag eingeben');return}
    const isIn=!!FX_IN[d.cat], t={id:uid(),date:d.date||todayS(),amount:isIn?a:-a,cat:d.cat,note:(d.note||'').trim()}, F=S.fin; let msg=isIn?`+${CHF(a)} eingetragen`:`${CHF(a)} Ausgabe eingetragen`;
    if(!isIn&&F.roundup.on&&potById(F.roundup.pot)){const diff=r2(Math.ceil(a-1e-9)-a);if(diff>0){t.round=potAdd(F.roundup.pot,diff,'Aufrunden');t.roundPot=F.roundup.pot;msg+=` · ${CHF(diff)} aufgerundet`}}
    if(isIn){const sv=applyRules(t);if(sv)msg+=` · ${CHF(sv)} gespart`}
    F.tx.push(t);finMonth=t.date.slice(0,7);toast(msg);save();render();return}
  if(f.id==='logForm'){const m=+d.min;if(!(m>0)){toast('Bitte Minuten eingeben');return}S.studyLog.push({id:uid(),date:d.date||todayS(),subject:d.subject,what:d.what.trim(),min:m});toast(`${m} min gespeichert`)}
  else {if(!d.text.trim())return;S.journal.push({id:uid(),date:todayS(),type:jType,subject:d.subject,text:d.text.trim()});toast('Im Journal festgehalten')}
  save();render();
});
document.addEventListener('input',e=>{
  const box=e.target.closest('.need'); if(!box||!e.target.dataset.need) return;
  const t=box.querySelector('[data-need="target"]').value, w=box.querySelector('[data-need="w"]').value;
  box.querySelector('[data-need="out"]').innerHTML=(+w>0&&+t>=1)?needText(box.dataset.sub,t,w):'';
});
render();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
